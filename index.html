<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="小岛来信创作赞赏页。谢谢你的喜欢，让文字、摄影与独立创作继续生长。" />
    <meta name="theme-color" content="#faf9f6" />
    <title>小岛来信 · 谢谢你，让创作继续</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./script.js" defer></script>
  </head>
  <body id="top">
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#top" aria-label="小岛来信首页">
          <svg class="brand-mark" viewBox="0 0 40 40" fill="none" aria-hidden="true">
            <circle cx="20" cy="20" r="8.5" fill="currentColor" />
            <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
              <path d="M20 2v5M20 33v5M2 20h5M33 20h5M7.3 7.3l3.5 3.5M29.2 29.2l3.5 3.5M32.7 7.3l-3.5 3.5M10.8 29.2l-3.5 3.5" />
            </g>
          </svg>
          <span>小岛来信</span>
        </a>
        <nav class="main-nav" aria-label="主导航">
          <a href="#about">关于我</a>
          <a href="#messages">创作</a>
          <a href="#support">赞赏</a>
        </nav>
        <a class="letter-link" href="#message">写信给我</a>
      </div>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-layout">
          <div class="intro" id="about">
            <h1 id="hero-title">谢谢你，<br />让创作继续。</h1>
            <p>每一篇文字、每一张照片，都因为你们的喜欢而有了继续生长的理由。</p>
          </div>

          <figure class="hero-photo">
            <img
              src="./assets/coffee-still-life.jpg"
              alt="晨光中的橙色咖啡杯、打开的笔记本与钢笔"
              fetchpriority="high"
            />
            <figcaption><strong>小岛</strong><span>/</span>写字、摄影与独立创作</figcaption>
          </figure>

          <form class="support-card" id="support">
            <h2>请小岛喝杯咖啡</h2>
            <div class="amount-options" role="group" aria-label="选择赞赏金额">
              <button type="button" class="amount-button" data-amount="6" aria-pressed="false">¥ 6</button>
              <button type="button" class="amount-button selected" data-amount="12" aria-pressed="true">¥ 12</button>
              <button type="button" class="amount-button" data-amount="20" aria-pressed="false">¥ 20</button>
              <button type="button" class="amount-button custom-trigger" data-amount="custom" aria-pressed="false">心意不限</button>
            </div>
            <div class="custom-amount" id="custom-amount" hidden>
              <label for="custom-value">自定义金额</label>
              <div class="amount-input-wrap">
                <span>¥</span>
                <input id="custom-value" type="number" min="1" max="99999" step="1" inputmode="numeric" placeholder="输入金额" />
              </div>
            </div>
            <div class="message-field">
              <label for="message">留一句话吧</label>
              <textarea id="message" name="message" rows="2" maxlength="80" aria-describedby="form-status"></textarea>
            </div>
            <button class="submit-button" type="submit">送出这份心意</button>
            <p class="demo-note">页面演示 · 不会发起真实支付</p>
            <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
          </form>
        </div>
      </section>

      <section class="messages-section" id="messages" aria-labelledby="messages-title">
        <div class="section-heading">
          <h2 id="messages-title">你的喜欢，我都收到了。</h2>
          <p>这些温暖的话，是创作路上最珍贵的回信。</p>
        </div>

        <div class="messages-layout" id="messages-list">
          <blockquote class="featured-message">
            <svg class="quote-mark" viewBox="0 0 72 56" fill="currentColor" aria-hidden="true">
              <path d="M0 56V34.4C0 11.7 10.5 1.1 31.5 0v12.4c-10.3 1.1-15.4 6.6-15.4 16.5H32V56H0Zm40 0V34.4C40 11.7 50.5 1.1 71.5 0v12.4c-10.3 1.1-15.4 6.6-15.4 16.5H72V56H40Z" />
            </svg>
            <p>你的文字陪我度过了很多个安静的夜晚，谢谢你一直在写。</p>
            <footer>— 阿澄</footer>
          </blockquote>

          <div class="message-rail">
            <article class="message-item">
              <div class="avatar" aria-hidden="true">林</div>
              <div>
                <h3>林一</h3>
                <p>咖啡补上，慢慢写，不着急。<svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-label="喜欢"><path d="M12 21s-7.5-4.5-9.7-9.1C.6 8.2 2.6 4 6.8 4c2.2 0 3.9 1.3 5.2 3.1C13.3 5.3 15 4 17.2 4c4.2 0 6.2 4.2 4.5 7.9C19.5 16.5 12 21 12 21Z" /></svg></p>
              </div>
            </article>
            <article class="message-item">
              <div class="avatar" aria-hidden="true">周</div>
              <div>
                <h3>周末散步</h3>
                <p>期待下一封小岛来信。<svg class="heart" viewBox="0 0 24 24" fill="currentColor" aria-label="喜欢"><path d="M12 21s-7.5-4.5-9.7-9.1C.6 8.2 2.6 4 6.8 4c2.2 0 3.9 1.3 5.2 3.1C13.3 5.3 15 4 17.2 4c4.2 0 6.2 4.2 4.5 7.9C19.5 16.5 12 21 12 21Z" /></svg></p>
              </div>
            </article>
          </div>
        </div>
      </section>

      <section class="closing-section" aria-label="结语">
        <div class="closing-inner">
          <p>愿我们都能在自己喜欢的事情里，慢慢发光。</p>
          <a href="#top">回到顶部 <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 16V4m0 0L5.5 8.5M10 4l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" /></svg></a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>© 2026 小岛来信</p>
      <p>用文字记录，用真心相遇</p>
    </footer>
  </body>
</html>
