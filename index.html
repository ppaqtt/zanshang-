<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<title>感谢相伴</title>
<style>
  :root{
    --coral:#E4573D;
    --coral-deep:#D9462B;
    --ink:#2b2b2b;
    --muted:#9a9a9a;
    --line:#ececec;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#e9e9ec;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .phone{
    width:100%;
    max-width:430px;
    min-height:100vh;
    background:#fff;
    display:flex;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  @media (min-width:431px){
    .phone{min-height:calc(100vh - 40px);margin:20px 0;border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.12);}
  }

  /* 顶部珊瑚色弧形头图 */
  .hero{
    position:relative;
    height:146px;
    flex:none;
    background:linear-gradient(180deg,var(--coral) 0%,var(--coral-deep) 100%);
    border-radius:0 0 50% 50% / 0 0 86px 86px;
  }
  .avatar{
    position:absolute;
    left:50%;
    bottom:0;
    transform:translate(-50%,42%);
    width:88px;
    height:88px;
    border-radius:50%;
    background:#fff;
    border:4px solid #fff;
    box-shadow:0 6px 18px rgba(0,0,0,.10);
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block;}
  .avatar .fallback{
    width:100%;height:100%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(145deg,#ee6a50,#d63f24);
    color:#fff;font-size:34px;font-weight:700;
  }

  /* 标题 */
  .brand{text-align:center;margin-top:62px;padding:0 24px;}
  .brand h1{
    margin:0;
    font-size:27px;
    font-weight:600;
    letter-spacing:1px;
    color:#3a3a3a;
  }
  .brand .sub{
    margin:10px 0 0;
    font-size:13px;
    color:var(--muted);
    min-height:18px;
  }

  /* 项目切换 */
  .tabs{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:8px;
    padding:20px 18px 0;
  }
  .tab{
    border:0;
    background:#f4f4f5;
    color:#777;
    font-size:13px;
    line-height:1;
    padding:9px 15px;
    border-radius:999px;
    cursor:pointer;
    transition:background .18s,color .18s;
  }
  .tab.active{
    background:#fdece8;
    color:var(--coral-deep);
    font-weight:600;
  }

  /* 金额 */
  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    padding:22px 20px 0;
  }
  .grid .amt:last-child:nth-child(3n+1){
    grid-column:2;
  }
  .amt{
    height:58px;
    background:#fff;
    border:1.5px solid var(--coral);
    border-radius:8px;
    color:var(--coral);
    font-size:27px;
    font-weight:500;
    display:flex;
    align-items:baseline;
    justify-content:center;
    gap:3px;
    cursor:pointer;
    transition:background .16s,color .16s,transform .1s;
    font-family:inherit;
  }
  .amt:active{transform:scale(.97);}
  .amt .yuan{font-size:12px;font-weight:400;}
  .amt.selected{
    background:var(--coral);
    color:#fff;
  }

  /* 底部声明 */
  .note{
    margin-top:auto;
    padding:44px 24px calc(26px + env(safe-area-inset-bottom));
    text-align:center;
    font-size:12px;
    color:#b9b9b9;
    line-height:1.7;
  }

  /* 二维码弹层 */
  .modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:99;
    opacity:0;
    visibility:hidden;
    transition:opacity .2s;
  }
  .modal.open{opacity:1;visibility:visible;}
  .modal-card{
    width:100%;
    max-width:340px;
    background:#fff;
    border-radius:18px;
    padding:20px 20px 18px;
    position:relative;
    max-height:calc(100vh - 48px);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    transform:translateY(8px);
    transition:transform .2s;
    text-align:center;
  }
  .modal.open .modal-card{transform:translateY(0);}
  .modal-close{
    position:absolute;
    top:8px;right:10px;
    width:32px;height:32px;
    border:0;background:transparent;
    font-size:24px;line-height:1;
    color:#bbb;cursor:pointer;
  }
  .modal-title{
    margin:6px 0 16px;
    font-size:16px;
    font-weight:600;
    color:#3a3a3a;
  }
  .qr-wrap{
    width:100%;
    aspect-ratio:5/6;
    max-height:52vh;
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#fff;
  }
  .qr-wrap img{width:100%;height:100%;object-fit:contain;display:block;}
  .qr-wrap .missing{
    width:100%;height:100%;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:6px;
    color:#bbb;font-size:13px;
    background:repeating-linear-gradient(45deg,#fafafa,#fafafa 10px,#f4f4f4 10px,#f4f4f4 20px);
  }
  .qr-wrap .missing span{font-size:12px;color:#c9c9c9;letter-spacing:.5px;}
  .modal-hint{
    margin:14px 0 0;
    font-size:13px;
    color:#888;
    line-height:1.6;
  }
  .modal-hint b{color:var(--coral-deep);font-weight:600;}
  .order-box{
    margin-top:12px;
    display:flex;
    align-items:center;
    gap:8px;
    padding:8px 10px;
    background:#fbf7f3;
    border:1px dashed #e7dcd1;
    border-radius:10px;
    text-align:left;
  }
  .order-box .label{
    flex:none;
    font-size:11px;
    color:#b39c88;
  }
  .order-box .no{
    flex:1;
    min-width:0;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    color:#6b5b4d;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    user-select:text;
  }
  .copy-btn{
    flex:none;
    border:0;
    border-radius:6px;
    background:var(--coral);
    color:#fff;
    font-size:11px;
    padding:5px 10px;
    font-family:inherit;
    cursor:pointer;
  }
  .copy-btn.copied{background:#8fbf9a;}
  .modal-tip{
    margin:6px 0 0;
    font-size:11px;
    color:#bbb;
  }
  .modal-note{
    margin:4px 0 0;
    font-size:10.5px;
    color:#cfc4b8;
  }
  .modal-done{
    margin-top:16px;
    width:100%;
    height:44px;
    border:0;
    border-radius:10px;
    background:var(--coral);
    color:#fff;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
    font-family:inherit;
  }
</style>
</head>
<body>
  <div class="phone">
    <header class="hero">
      <div class="avatar" id="avatar"></div>
    </header>

    <div class="brand">
      <h1 id="brandTitle">感谢相伴</h1>
      <p class="sub" id="subtitle"></p>
    </div>

    <nav class="tabs" id="tabs" aria-label="选择项目"></nav>

    <main class="grid" id="grid" aria-label="选择赞赏金额"></main>

    <p class="note" id="pageNote">赞赏是为表示鼓励而对文章内容的无偿赠予</p>
  </div>

  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
      <p class="modal-title" id="modalTitle"></p>
      <div class="qr-wrap" id="qrWrap"></div>
      <div class="order-box">
        <span class="label">订单号</span>
        <span class="no" id="orderNo"></span>
        <button class="copy-btn" id="copyBtn" type="button">复制</button>
      </div>
      <p class="modal-hint" id="modalHint"></p>
      <p class="modal-tip">付款时把订单号填入「添加备注」，方便核对</p>
      <p class="modal-note">订单号仅用于对账，不代表支付成功</p>
      <button class="modal-done" id="modalDone">完成</button>
    </div>
  </div>

<script>
  /* ====== 默认配置：服务器没有配置时使用，正式配置在管理台维护 ====== */
  const DEFAULT_PROJECTS = [
    {
      id: 'qingjian',
      name: '清笺',
      code: 'qingjian',
      prefix: 'QJ',
      qr: 'assets/qingjian-qr.jpg',
      avatar: 'assets/qingjian-logo.jpg',
      sub: '感谢你的支持与陪伴'
    },
    {
      id: 'xiaomengjizhang',
      name: '小萌记账',
      code: 'xiaomengjizhang',
      prefix: 'XM',
      qr: 'assets/xiaomengjizhang-qr.jpg',
      avatar: 'assets/xiaomengjizhang-logo.jpg',
      sub: '感谢你的支持与陪伴'
    },
    {
      id: 'ppdxpz',
      name: '平平的小破站',
      code: 'ppdxpz',
      prefix: 'PPDXPZ',
      qr: 'assets/ppdxpz-qr.jpg',
      avatar: 'assets/ppdxpz-logo.webp',
      sub: '感谢你的支持与陪伴'
    }
  ];

  const DEFAULT_AMOUNTS = [1, 5, 10, 20, 50, 100, 500, 666, 888, 1000];

  let PROJECTS = DEFAULT_PROJECTS;
  let AMOUNTS = DEFAULT_AMOUNTS;
  let THEME = null;
  let currentProject = 0;
  let selectedAmount = null;

  const tabsEl = document.getElementById('tabs');
  const gridEl = document.getElementById('grid');
  const subtitleEl = document.getElementById('subtitle');
  const avatarEl = document.getElementById('avatar');
  const modal = document.getElementById('modal');
  const modalTitle = document.getElementById('modalTitle');
  const modalHint = document.getElementById('modalHint');
  const qrWrap = document.getElementById('qrWrap');
  const orderNoEl = document.getElementById('orderNo');
  const copyBtn = document.getElementById('copyBtn');

  function renderTabs() {
    tabsEl.innerHTML = '';
    PROJECTS.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'tab' + (i === currentProject ? ' active' : '');
      btn.textContent = p.name;
      btn.setAttribute('aria-pressed', i === currentProject ? 'true' : 'false');
      btn.addEventListener('click', () => {
        if (i === currentProject) return;
        currentProject = i;
        selectedAmount = null;
        renderTabs();
        renderGrid();
        renderAvatar();
        subtitleEl.textContent = p.sub;
      });
      tabsEl.appendChild(btn);
    });
  }

  function renderGrid() {
    gridEl.innerHTML = '';
    AMOUNTS.forEach(amount => {
      const btn = document.createElement('button');
      btn.className = 'amt' + (selectedAmount === amount ? ' selected' : '');
      btn.innerHTML = amount + '<span class="yuan">元</span>';
      btn.setAttribute('aria-label', '赞赏 ' + amount + ' 元');
      btn.addEventListener('click', () => {
        selectedAmount = amount;
        renderGrid();
        openModal(amount);
      });
      gridEl.appendChild(btn);
    });
  }

  function renderAvatar() {
    const p = PROJECTS[currentProject];
    avatarEl.innerHTML = '';
    const fallback = document.createElement('div');
    fallback.className = 'fallback';
    fallback.textContent = p.name.charAt(0);
    avatarEl.appendChild(fallback);

    if (p.avatar) {
      const img = document.createElement('img');
      img.alt = p.name;
      img.src = p.avatar;
      img.onload = () => { avatarEl.innerHTML = ''; avatarEl.appendChild(img); };
      img.onerror = () => { /* 保留首字兜底 */ };
    }
  }

  function pad2(n) { return n < 10 ? '0' + n : '' + n; }

  function genOrderNo(project) {
    const d = new Date();
    const ts = '' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) +
      pad2(d.getHours()) + pad2(d.getMinutes()) + pad2(d.getSeconds());
    const rand = Math.random().toString(36).slice(2, 5).toUpperCase();
    return project.prefix + '-' + ts + '-' + rand;
  }

  function reportOrder(record) {
    try {
      fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ source: getSource() }, record)),
        keepalive: true
      }).catch(() => {});
    } catch (e) {}
  }

  function getSource() {
    try {
      const from = new URLSearchParams(location.search).get('from');
      if (from) return from.trim().slice(0, 60);
      if (document.referrer) {
        const h = new URL(document.referrer).hostname;
        if (h && h !== location.hostname) return h.slice(0, 60);
      }
    } catch (e) {}
    return '';
  }

  function shade(hex, percent) {
    const n = parseInt(hex.slice(1), 16);
    const f = 1 + percent / 100;
    const clamp = v => Math.max(0, Math.min(255, Math.round(v * f)));
    const r = clamp((n >> 16) & 255), g = clamp((n >> 8) & 255), b = clamp(n & 255);
    return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
  }

  function applyTheme(t) {
    if (!t) return;
    if (/^#[0-9A-Fa-f]{6}$/.test(t.accent || '')) {
      const root = document.documentElement.style;
      root.setProperty('--coral', t.accent.toUpperCase());
      root.setProperty('--coral-deep', shade(t.accent, -12));
    }
    if (t.title) document.getElementById('brandTitle').textContent = t.title;
    if (t.pageTitle) document.title = t.pageTitle;
    if (t.footer) document.getElementById('pageNote').textContent = t.footer;
  }

  function trackView() {
    try {
      fetch('/api/track', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: '{}',
        keepalive: true
      }).catch(() => {});
    } catch (e) {}
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) {
      return navigator.clipboard.writeText(text);
    }
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      ok ? resolve() : reject();
    });
  }

  function openModal(amount) {
    const p = PROJECTS[currentProject];
    modalTitle.textContent = '向「' + p.name + '」赞赏 ¥' + amount;
    modalHint.innerHTML = '长按识别二维码，在付款页选择「赞赏 ' + amount + 'r」';

    const orderNo = genOrderNo(p);
    orderNoEl.textContent = orderNo;
    copyBtn.textContent = '复制';
    copyBtn.classList.remove('copied');
    reportOrder({ order: orderNo, project: p.name, amount: amount });

    qrWrap.innerHTML = '';

    const img = document.createElement('img');
    img.alt = p.name + '收款二维码';
    img.src = p.qr;
    img.onerror = () => {
      qrWrap.innerHTML =
        '<div class="missing">二维码待放入<span>assets/' + p.code + '.png</span></div>';
    };
    qrWrap.appendChild(img);

    modal.classList.add('open');
  }

  function closeModal() {
    modal.classList.remove('open');
    selectedAmount = null;
    renderGrid();
  }

  document.getElementById('modalClose').addEventListener('click', closeModal);
  document.getElementById('modalDone').addEventListener('click', closeModal);
  modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  copyBtn.addEventListener('click', () => {
    copyText(orderNoEl.textContent).then(() => {
      copyBtn.textContent = '已复制';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = '复制';
        copyBtn.classList.remove('copied');
      }, 1500);
    }).catch(() => {
      copyBtn.textContent = '请长按订单号';
      setTimeout(() => { copyBtn.textContent = '复制'; }, 2000);
    });
  });

  async function loadRemoteConfig() {
    try {
      const res = await fetch('/api/config', { cache: 'no-store' });
      if (!res.ok) return;
      const data = await res.json();
      if (data && Array.isArray(data.projects) && data.projects.length &&
          Array.isArray(data.amounts) && data.amounts.length) {
        PROJECTS = data.projects;
        AMOUNTS = data.amounts;
        THEME = data.theme || null;
        currentProject = 0;
      }
    } catch (e) { /* 接口不可用时用默认配置 */ }
  }

  (async function init() {
    await loadRemoteConfig();
    applyTheme(THEME);
    renderTabs();
    renderGrid();
    renderAvatar();
    subtitleEl.textContent = PROJECTS[currentProject].sub;
    trackView();
  })();
</script>
</body>
</html>
